# Checks out the private repository Lemonade4400/anima and runs its build script, scripts/build (anima D-0083).
# The checkout uses a read-only deploy key of anima, stored here as the secret ANIMA_DEPLOY_KEY.
# Every output line goes to Better Stack (source anima-ci); this public log shows only step outcomes (anima D-0088).
# The result is the commit status `build` on anima; a green pull request is merged by anima's scripts/merge
# (anima D-0084). The token ANIMA_TOKEN is used only in the jobs that do not run anima's code under test, so the
# code being built can never read it: `pending` before the build, `report` after it, from a checkout of main.
name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of anima to build
        default: main
  repository_dispatch:
    types: [build]

permissions:
  contents: read

env:
  ANIMA_REF: ${{ inputs.ref || github.event.client_payload.ref || 'main' }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  pending:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.status.outputs.commit }}
    steps:
      - name: Status pending
        id: status
        env:
          GH_TOKEN: ${{ secrets.ANIMA_TOKEN }}
        run: |
          commit="$(gh api "repos/Lemonade4400/anima/commits/$ANIMA_REF" --jq .sha)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          gh api --silent "repos/Lemonade4400/anima/statuses/$commit" \
            -f state=pending -f context=build -f target_url="$RUN_URL"

  build:
    needs: pending
    runs-on: ubuntu-latest
    # 75, not 45: on a clean checkout, with no vitest cache, the static mutants of the hooks run the whole suite and
    # the mutation gate alone went past 45 minutes twice (pull request #176, 2026-10-29). Same cause as Stryker's
    # dry run raised to 15 minutes (anima D-0543); minutes are free on a public runner (anima D-0673).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Lemonade4400/anima
          ref: ${{ needs.pending.outputs.commit }}
          ssh-key: ${{ secrets.ANIMA_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0

      # The build tests the pull request merged with the current main, not its head alone (anima D-0117). The
      # commit status and scripts/merge keep referring to the head, needs.pending.outputs.commit. A commit that
      # main already contains (a dispatch of main itself) has nothing to merge.
      - name: Merge main
        env:
          ANIMA_PULL_REQUEST: ${{ github.event.client_payload.pull_request }}
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "main already contains this commit: nothing to merge."
            exit 0
          fi
          name="${ANIMA_PULL_REQUEST:+Pull request #$ANIMA_PULL_REQUEST}"
          if ! git -c user.name=anima-runner -c user.email=anima-runner@users.noreply.github.com \
            merge --no-edit origin/main > /dev/null 2>&1; then
            echo "::error::${name:-$ANIMA_REF} conflicts with main: merge main into the branch and push."
            exit 1
          fi
          echo "Building the commit merged with main $(git rev-parse --short origin/main)."

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The harness runs from main, never from the code under test (anima D-0117): every path listed in main's
      # scripts/protected is restored from main. A change to one of them takes effect from the next build.
      - name: Harness from main
        run: |
          if ! git show origin/main:scripts/protected > "$RUNNER_TEMP/protected" 2>/dev/null; then
            echo "main has no scripts/protected: nothing to restore"
            exit 0
          fi
          paths=()
          while read -r item; do paths+=("$item"); done < <(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' "$RUNNER_TEMP/protected")
          for item in "${paths[@]}"; do
            rm -rf -- "$item"
            git checkout -q origin/main -- "$item" 2>/dev/null || true
          done
          changed="$(git diff --name-only HEAD -- "${paths[@]}")"
          if [ -n "$changed" ]; then
            echo "Protected paths changed by this commit, built with main's version (they take effect from the next build):"
            echo "$changed"
          else
            echo "No protected path changed: the harness is main's."
          fi

      - name: Build
        env:
          LOGTAIL_CI_TOKEN: ${{ secrets.LOGTAIL_CI_TOKEN }}
          LOGTAIL_CI_URL: ${{ vars.LOGTAIL_CI_URL }}
          ANIMA_PULL_REQUEST: ${{ github.event.client_payload.pull_request }}
          ANIMA_COMMIT: ${{ needs.pending.outputs.commit }}
        run: scripts/build

  report:
    needs: [pending, build]
    if: always() && needs.pending.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Status
        env:
          GH_TOKEN: ${{ secrets.ANIMA_TOKEN }}
          COMMIT: ${{ needs.pending.outputs.commit }}
          STATE: ${{ needs.build.result == 'success' && 'success' || 'failure' }}
        run: |
          gh api --silent "repos/Lemonade4400/anima/statuses/$COMMIT" \
            -f state="$STATE" -f context=build -f target_url="$RUN_URL"

      - uses: actions/checkout@v7
        if: needs.build.result == 'success' && github.event.client_payload.pull_request
        with:
          repository: Lemonade4400/anima
          ref: main
          ssh-key: ${{ secrets.ANIMA_DEPLOY_KEY }}
          persist-credentials: false

      - name: Merge
        if: needs.build.result == 'success' && github.event.client_payload.pull_request
        env:
          ANIMA_TOKEN: ${{ secrets.ANIMA_TOKEN }}
          ANIMA_PULL_REQUEST: ${{ github.event.client_payload.pull_request }}
          ANIMA_COMMIT: ${{ needs.pending.outputs.commit }}
        run: scripts/merge
