# Polls the private repository Lemonade4400/anima (anima D-0117): anima keeps no secret and no workflow of its own,
# so this one starts what its dispatch workflow used to. Every fifteen minutes on GitHub's schedule, and within
# thirty seconds from the user's Mac when anima has work (anima's scripts/poll through launchd, D-0119): GitHub's
# schedule fired once in its first ninety minutes. A build for every open pull request
# head without a `build` status; a merge attempt (anima's scripts/merge, from main) for every open, non-draft pull
# request whose head is green; a deploy for the head of main without a `deploy` status, unless everything since the
# last successfully deployed commit is documentation (then only the status `deploy` = success is posted). The
# pending status is posted here before the dispatch, so a slow start never doubles a build or a deploy.
name: poll

on:
  schedule:
    - cron: '*/15 * * * *'
  # Also right after every build or deploy, so a merge is deployed without waiting for the next tick.
  workflow_run:
    workflows: [build, deploy]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: read

env:
  ANIMA: Lemonade4400/anima
  RUNNER: Lemonade4400/anima-runner
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Builds
        env:
          GH_TOKEN: ${{ secrets.ANIMA_TOKEN }}
        run: |
          : > "$RUNNER_TEMP/green"
          gh api --paginate "repos/$ANIMA/pulls?state=open&per_page=100" --jq '.[] | "\(.number) \(.head.sha) \(.draft)"' > "$RUNNER_TEMP/pulls"
          while read -r number sha draft; do
            state="$(gh api "repos/$ANIMA/commits/$sha/status" --jq '[.statuses[] | select(.context == "build")][0].state // "none"')"
            case "$state" in
              none)
                gh api --silent "repos/$ANIMA/statuses/$sha" -f state=pending -f context=build -f target_url="$RUN_URL"
                gh api --silent "repos/$RUNNER/dispatches" -f event_type=build -f "client_payload[ref]=$sha" -F "client_payload[pull_request]=$number"
                echo "#$number $sha: build started" ;;
              success)
                if [ "$draft" = true ]; then echo "#$number $sha: green draft, left alone"; else echo "$number $sha" >> "$RUNNER_TEMP/green"; fi ;;
              *) echo "#$number $sha: build $state" ;;
            esac
          done < "$RUNNER_TEMP/pulls"
          echo "$(wc -l < "$RUNNER_TEMP/pulls" | tr -d ' ') open pull requests, $(wc -l < "$RUNNER_TEMP/green" | tr -d ' ') green to merge"

      - uses: actions/checkout@v7
        with:
          repository: Lemonade4400/anima
          ref: main
          ssh-key: ${{ secrets.ANIMA_DEPLOY_KEY }}
          persist-credentials: false

      - name: Merges
        env:
          ANIMA_TOKEN: ${{ secrets.ANIMA_TOKEN }}
        run: |
          while read -r number sha; do
            ANIMA_PULL_REQUEST="$number" ANIMA_COMMIT="$sha" scripts/merge || echo "::warning::#$number not merged, see above"
          done < "$RUNNER_TEMP/green"

      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.ANIMA_TOKEN }}
        run: |
          # The newest of the last 50 commits of main whose `deploy` status is success (deployed, or skipped below);
          # none: empty. A failed or pending deploy is not an anchor, so its code is deployed again.
          last_deployed() {
            local commit
            for commit in $(gh api "repos/$ANIMA/commits?sha=main&per_page=50" --jq '.[].sha'); do
              if [ "$(gh api "repos/$ANIMA/commits/$commit/status" \
                --jq 'any(.statuses[]; .context == "deploy" and .state == "success")')" = true ]; then
                echo "$commit"
                return
              fi
            done
          }
          # True when every file changed from $1 to $2 is documentation, the rule of anima's .githooks/pre-push
          # (anima D-0086): *.md, kb/, docs/, .nimbalyst/. A failed comparison is not documentation. The files come
          # only on the first page and stop at 300: a list that long may hide code, so it is not documentation.
          documentation_only() {
            local file
            gh api --paginate "repos/$ANIMA/compare/$1...$2?per_page=100" \
              --jq '(.files // []) | if length >= 300 then "(300 files or more)"
                else .[] | .filename, (.previous_filename // empty) end' > "$RUNNER_TEMP/changed" || return 1
            while IFS= read -r file; do
              case "$file" in
                *.md | kb/* | docs/* | .nimbalyst/*) ;;
                *) return 1 ;;
              esac
            done < "$RUNNER_TEMP/changed"
          }

          sha="$(gh api "repos/$ANIMA/commits/main" --jq .sha)"
          state="$(gh api "repos/$ANIMA/commits/$sha/status" --jq '[.statuses[] | select(.context == "deploy")][0].state // "none"')"
          last=""
          [ "$state" != none ] || last="$(last_deployed)"
          if [ -n "$last" ] && documentation_only "$last" "$sha"; then
            gh api --silent "repos/$ANIMA/statuses/$sha" -f state=success -f context=deploy \
              -f description="documentation only, not deployed" -f target_url="$RUN_URL"
            echo "main $sha: documentation only since $last, not deployed"
          elif [ "$state" = none ]; then
            gh api --silent "repos/$ANIMA/statuses/$sha" -f state=pending -f context=deploy -f target_url="$RUN_URL"
            gh api --silent "repos/$RUNNER/dispatches" -f event_type=deploy -f "client_payload[ref]=$sha"
            echo "main $sha: deploy started"
          else
            echo "main $sha: deploy $state"
          fi
